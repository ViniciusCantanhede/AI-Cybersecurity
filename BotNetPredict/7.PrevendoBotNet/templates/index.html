<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão de Botnet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 500px;  /* Aumentando a largura */
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-align: left;
        }

        input {
            width: calc(100% - 20px);  /* Aumentando a largura do input */
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            color: #333;
        }
    </style>
    <script>
        async function makePrediction() {
            // Coletar os dados do formulário
            const inputData = {
                input: [
                    parseFloat(document.getElementById('trafego').value),
                    parseFloat(document.getElementById('duracao_conexao').value),
                    parseFloat(document.getElementById('num_pacotes').value),
                    parseFloat(document.getElementById('bytes_transferidos').value),
                    parseFloat(document.getElementById('num_erros').value)
                ]
            };

            // Enviar a requisição para o servidor Flask
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(inputData)
            });

            // Coletar a resposta e exibir na página
            const result = await response.json();
            const resultElement = document.getElementById('result');
            resultElement.textContent = 'Previsão: ' + (result.prediction === 1 ? 'Botnet Detectado' : 'Tráfego Normal');
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Previsão de Ataques de Botnet</h1>

        <form onsubmit="event.preventDefault(); makePrediction();">
            <label for="trafego">Tráfego (em bytes):</label>
            <input type="number" id="trafego" step="any" required>

            <label for="duracao_conexao">Duração da Conexão (em segundos):</label>
            <input type="number" id="duracao_conexao" step="any" required>

            <label for="num_pacotes">Número de Pacotes:</label>
            <input type="number" id="num_pacotes" step="any" required>

            <label for="bytes_transferidos">Bytes Transferidos:</label>
            <input type="number" id="bytes_transferidos" step="any" required>

            <label for="num_erros">Número de Erros:</label>
            <input type="number" id="num_erros" step="any" required>

            <button type="submit">Prever</button>
        </form>

        <p id="result"></p>
    </div>
</body>
</html>
